services:
  # -------------------------------------------------------------
  # Backend: FastAPI Web Service
  # -------------------------------------------------------------
  - type: web
    name: dashbord-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: dashbord-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: MAIL_SERVER
        value: "smtp.gmail.com"
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: "Dev Productivity"
      - key: MAIL_STARTTLS
        value: "True"
      - key: MAIL_SSL_TLS
        value: "False"
      - key: MAIL_USE_CREDENTIALS
        value: "True"
      - key: MAIL_VALIDATE_CERTS
        value: "True"

  # -------------------------------------------------------------
  # Frontend: React Vite Static Site
  # -------------------------------------------------------------
  - type: web
    name: dashbord-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: dashbord-backend
          property: host

databases:
  # -------------------------------------------------------------
  # Managed PostgreSQL Database on Render
  # -------------------------------------------------------------
  - name: dashbord-db
    databaseName: dashbord
    user: dashbord_user
